
name: Build Proton VPN Location Picker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Location Picker repository
        uses: actions/checkout@v4

      - name: Checkout official Proton VPN Android source
        uses: actions/checkout@v4
        with:
          repository: ProtonVPN/android-app
          ref: master
          path: upstream
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Apply Location Picker patch
        run: python3 tools/integrate_picker.py upstream

      - name: Configure Room schema directory
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          source = path.read_text(encoding="utf-8")

          if 'schemaDirectory "$projectDir/schemas"' not in source:
              marker = "android {\n"
              if marker not in source:
                  raise SystemExit("Could not find android block in app/build.gradle")

              source = source.replace(
                  marker,
                  marker + '    room {\n'
                           '        schemaDirectory "$projectDir/schemas"\n'
                           '    }\n',
                  1
              )
              path.write_text(source, encoding="utf-8")

          print("Room schema directory configured.")
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android native build packages
        run: |
          sdkmanager --install \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Make Gradle executable
        working-directory: upstream
        run: chmod +x ./gradlew

      - name: Build Proton VPN APK
        working-directory: upstream
        env:
          OVERRIDE_VERSION_NAME: '1.0.0-locationpicker'
        run: |
          ./gradlew assembleProductionVanillaOpenSourceDebug \
            --no-daemon \
            --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: protonvpn-location-picker-debug-apk
          path: upstream/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
