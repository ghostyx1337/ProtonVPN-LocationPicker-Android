
name: ProtonVPN Location Picker Android build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out integration repository
        uses: actions/checkout@v4

      - name: Check out upstream ProtonVPN Android source
        uses: actions/checkout@v4
        with:
          repository: ProtonVPN/android-app
          path: upstream
          ref: master

      - name: Apply Location Picker integration
        run: python3 tools/integrate_picker.py upstream

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y swig

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native build packages
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build debug APK
        working-directory: upstream
        run: ./gradlew assembleProductionVanillaOpenSourceDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: protonvpn-location-picker-debug-apk
          path: upstream/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
