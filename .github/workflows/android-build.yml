
name: Build Proton VPN Location Picker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Location Picker repository
        uses: actions/checkout@v4

      - name: Checkout official Proton VPN Android source
        uses: actions/checkout@v4
        with:
          repository: ProtonVPN/android-app
          ref: master
          path: upstream
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Apply Location Picker patch
        run: python3 tools/integrate_picker.py upstream

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android native build packages
        run: |
          sdkmanager --install \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Make Gradle executable
        working-directory: upstream
        run: chmod +x ./gradlew

      - name: Build Proton VPN APK
        working-directory: upstream
        run: |
          ./gradlew assembleProductionVanillaOpenSourceDebug \
            --no-daemon \
            --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: protonvpn-location-picker-debug-apk
          path: upstream/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
